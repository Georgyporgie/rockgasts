<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>RockRadio</title>
  <link rel="stylesheet" href="style3.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    /* --- Layout --- */
     body { margin:0; font-family:sans-serif; background:#111; color:#fff; }

    .top-bar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:8px 16px;
     
      border: solid 5px #6166A ;

    }

    #kroonImage { height:30px; width:auto; }

    /* --- Marquee --- */
    #marquee {
      flex:1;
      overflow:hidden;
      white-space:nowrap;
      opacity:0;
      transition:opacity 1s ease;
      text-align:center;
    }
    #marquee.visible { opacity:1; }

    #marquee span {
      position:relative;
      font-family:'Rubik Moonrocks',cursive;
      font-size:18px;
      animation:marquee 8s linear infinite;
      background:linear-gradient(to right,#ff8c00,#ff69b4);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      text-shadow:2px 2px 4px #ff69b4;
    }
    @keyframes marquee {
      0%   { left:100%; }
      100% { left:-100%; }
    }

    /* --- Clock --- */
    #clock { display:block; }

    /* --- Program image/message --- */
  
    #timeMessage {
      text-align:center;
      font-size:20px;
      font-style:italic;
      font-weight:bold;
      text-decoration:underline #FF0026;
    }

    .blink { animation:blink 1s step-start infinite; }
    @keyframes blink { 50% { opacity:0; } }
  </style>
</head>
<body>

  <div class="top-bar">
    <img id="kroonImage" alt="ON AIR lamp">
    <div id="marquee"><span>RockRadio Live Vibes...</span></div>
    <canvas id="clock" width="80" height="80"></canvas>
  </div>
<br> <br><br><br>
  <img id="myImage" alt="Program image">
  <br>
  <p id="timeMessage"></p>

  <script>
    function safeSrc(path){ return path.replace(/ /g,'%20'); }

    function updateImage(){
      const timeMessage=document.getElementById("timeMessage");
      const img=document.getElementById("myImage");
      const kroon=document.getElementById("kroonImage");
      const marquee=document.getElementById("marquee");

      const now=new Date();
      const hour=now.getHours();
      const day=now.getDay();
      const isWeekend=(day===6||day===0)||(day===5&&hour>=18)||(day===0&&hour<21);

      let djActive=false;

      if(isWeekend){
        if(hour>=12&&hour<17){
          img.src=safeSrc('images/Sunny rock.gif');
          timeMessage.textContent="";
          timeMessage.classList.add('blink');
          djActive=true;
        }else if(hour>=17&&hour<21){
          img.src=safeSrc('images/Bjorn Hamburger.png');
          timeMessage.textContent="";
          timeMessage.classList.add('blink');
          djActive=true;
        }else{
          img.src=safeSrc('images/Sunny rock.gif');
          timeMessage.textContent="";
          timeMessage.classList.remove('blink');
        djActive=true;
        }
      }else{
        img.src=safeSrc('images/transparent.png');
        timeMessage.textContent="";
        timeMessage.classList.remove('blink');
      djActive = false;
      }

      // ON AIR lamp
      kroon.src=safeSrc(djActive?'images/on air.gif':'images/on air.png');

      // Marquee fade in/out
      if(djActive){ marquee.classList.add("visible"); }
      else{ marquee.classList.remove("visible"); }
    }

    window.addEventListener('load',updateImage);
    setInterval(updateImage,60000);

    // --- Analog clock ---
    const canvas=document.getElementById("clock");
    const ctx=canvas.getContext("2d");
    const radius=canvas.width/2;
    ctx.translate(radius,radius);

    function drawClock(){
      ctx.clearRect(-radius,-radius,canvas.width,canvas.height);
      ctx.beginPath();
      ctx.arc(0,0,radius-2,0,2*Math.PI);
      ctx.fillStyle="#000"; ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();

      const now=new Date();
      let hour=now.getHours()%12;
      let minute=now.getMinutes();
      let second=now.getSeconds();

      drawHand((hour+minute/60)*Math.PI/6,radius*0.5,3,"#f0f");
      drawHand((minute+second/60)*Math.PI/30,radius*0.7,2,"#0f0");
      drawHand(second*Math.PI/30,radius*0.85,1,"#ff0");
    }
    function drawHand(angle,length,width,color){
      ctx.beginPath();
      ctx.lineWidth=width;
      ctx.lineCap="round";
      ctx.strokeStyle=color;
      ctx.moveTo(0,0);
      ctx.rotate(angle);
      ctx.lineTo(0,-length);
      ctx.stroke();
      ctx.rotate(-angle);
    }
    function updateClock(){ drawClock(); requestAnimationFrame(updateClock); }
    updateClock();
  </script>
</body>
</html>
