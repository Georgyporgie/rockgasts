<script>
function updateImage() {
  const timeMessage = document.getElementById("timeMessage"); 
  const img = document.getElementById("myImage");
  const kroon = document.getElementById("kroonImage");

  const now = new Date();
  const hour = now.getHours();
  const day = now.getDay();

  const isWeekend =
    (day === 6 || day === 0) ||
    (day === 5 && hour >= 18) ||
    (day === 0 && hour < 21);

  function textBlink(shouldBlink) {
    timeMessage.classList.toggle('blink', shouldBlink);
  }

  let djActive = false;

  if (isWeekend) {
    if (hour >= 7 && hour < 12) {
      img.src = 'images/aquarium3.gif'; 
      timeMessage.textContent = "Good morning!";
      djActive = true;
    } else if (hour >= 12 && hour < 17) {
      img.src = 'images/Sunny rock.gif';
      timeMessage.textContent = "Hillbillies!";
      djActive = true;
    } else if (hour >= 17 && hour < 21) {
      img.src = 'images/Bjorn Hamburger.png';
      timeMessage.textContent = "Björn Hamburger";
      djActive = true;
    } else if (hour >= 21 && hour < 23) {
      img.src = 'images/Sunny rock.gif';
      timeMessage.textContent = "Hillbillies!";
      djActive = true;
    } else {
      img.src = 'images/aquarium.png';
      timeMessage.textContent = "Good night!";
    }
  } else {
    if (hour >= 7 && hour < 12) {
      img.src = 'images/transparent.png';
      timeMessage.textContent = "Good morning!";
    } else if (hour >= 12 && hour < 17) {
      img.src = 'images/transparent.png';
      timeMessage.textContent = "Afternoon vibes!";
    } else if (hour >= 17 && hour < 23) {
      img.src = 'images/transparent.png';
      timeMessage.textContent = "Evening mood!";
    } else {
      img.src = 'images/aquarium3.gif';
      timeMessage.textContent = "Night reflections!";
    }
  }

  // 🔴 ON AIR lamp logic
  kroon.src = djActive ? 'images/on air.gif' : 'images/on air.png';
}

window.onload = updateImage;
setInterval(updateImage, 60000); // check every minute
</script>
